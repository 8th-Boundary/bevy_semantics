[package]
name = "bevy_semantics"
version = "0.2.0"
edition = "2021"
rust-version = "1.95.0"
description = "Semantic identity, ontology, and query infrastructure for Bevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/8th-Boundary/bevy_semantics"
homepage = "https://github.com/8th-Boundary/bevy_semantics"
documentation = "https://docs.rs/bevy_semantics"
readme = "README.md"
authors = ["8th Boundary"]
keywords = ["bevy", "semantics", "ontology", "graph"]
categories = ["game-development"]

[dependencies]
blake3 = "1"
bevy_app = "0.19"
bevy_ecs = "0.19"
bevy_reflect = "0.19"
bevy_platform = "0.19"
bevy_tasks = "0.19"

[dev-dependencies]
criterion = { version = "0.5", default-features = true }

[[example]]
name = "basic"

[[example]]
name = "task_playback"

[[bench]]
name = "semantics_bench"
harness = false
